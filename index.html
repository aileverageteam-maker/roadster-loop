<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="screen-orientation" content="landscape">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Roadster Loop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#030508;--neon:#00e8ff;--gold:#ffc94d;--ok:#35ff7a;--bad:#ff3b5c;--ink:#e8f4ff;--yoke:#eef0f4;--panel:rgba(4,8,16,.92)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;transform-origin:center center;background:var(--bg);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,190,70,.10) 0%,transparent 40%,rgba(255,190,70,.12) 100%);box-shadow:inset 0 60px 50px -30px #000,inset 0 -30px 30px -15px rgba(0,0,0,.4)}
#gas{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.55),transparent 50%)}
#gas.on{animation:gas .6s ease-out}@keyframes gas{0%{opacity:var(--o,1)}100%{opacity:0}}
.layer{position:absolute;inset:0;display:none;pointer-events:none}.layer.on{display:block}
button,.panel,.pill,.tapzone{pointer-events:auto}
.top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:5}
.pill{background:var(--panel);border:1px solid rgba(0,232,255,.4);border-radius:22px;padding:6px 14px;font-size:15px;font-weight:600;backdrop-filter:blur(8px)}
.row{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:24px;z-index:5}
.panel .row{position:static;margin-top:14px;flex-wrap:wrap;gap:12px}
.ib{border:2px solid var(--neon);background:rgba(0,232,255,.1);color:var(--ink);border-radius:50%;width:56px;height:56px;font-size:22px;cursor:pointer;box-shadow:0 0 16px rgba(0,232,255,.2);padding:0;-webkit-tap-highlight-color:transparent}
.ib:active{transform:scale(.92)}
.ib.big{width:92px;height:92px;font-size:42px}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid rgba(0,232,255,.45);border-radius:18px;padding:18px 24px;text-align:center;font-size:20px;min-width:240px;backdrop-filter:blur(12px)}
#splash{background:radial-gradient(ellipse at 50% 40%,#0a1525 0%,var(--bg) 70%)}
#splash.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#splash .logo{width:min(68vw,340px);filter:drop-shadow(0 0 14px rgba(0,232,255,.45))}
#splash .tag{font-size:13px;letter-spacing:4px;color:rgba(0,232,255,.65);opacity:0;animation:fi .5s 1s forwards}
@keyframes fi{to{opacity:1}}
.wf{fill:none;stroke:var(--neon);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:dr 1.4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.wf-fill{fill:rgba(0,232,255,.07);stroke:none;opacity:0;animation:fi .4s 1.1s forwards}
#menu .title{position:absolute;top:11%;left:0;right:0;text-align:center;font-size:clamp(22px,5vw,36px);font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,var(--neon),#7af,#ffc94d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#menu .route{position:absolute;top:24%;left:0;right:0;text-align:center;font-size:14px;color:rgba(0,232,255,.7)}
#menu .hint{position:absolute;top:32%;left:0;right:0;text-align:center;font-size:12px;color:rgba(232,244,255,.4)}
#hud .dash{position:absolute;left:50%;bottom:calc(2px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(48vw,280px);pointer-events:none;transform-origin:50% 72%}
#hud .dash svg{width:100%;display:block;filter:drop-shadow(0 0 6px rgba(0,232,255,.25))}
#spd{position:absolute;left:0;right:0;top:36%;text-align:center;font:700 30px/1 ui-monospace,monospace;color:#fff;text-shadow:0 0 10px var(--gold)}
#spd small{display:block;font-size:10px;letter-spacing:2px;opacity:.65;margin-top:1px}
#air{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:90px;width:12px;height:100px;border:2px solid rgba(0,232,255,.45);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;background:rgba(3,5,8,.7)}
#airf{display:block;width:100%;height:100%;background:linear-gradient(0deg,var(--neon),#7af)}
#fan{position:absolute;left:calc(38px + env(safe-area-inset-left,0px));bottom:100px;width:22px;height:22px;border-radius:50%;background:#0a1520;border:2px solid #234}
#fan.on{background:var(--ok);box-shadow:0 0 12px var(--ok);border-color:var(--ok)}
.ico{position:absolute;font-size:14px;opacity:.8}
#routeHud{position:absolute;top:calc(44px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:12px;letter-spacing:1px;color:rgba(232,244,255,.65);text-shadow:0 0 6px #000;z-index:5;pointer-events:none}
#routeHud b{color:var(--neon)}
.tapzone{position:absolute;top:0;bottom:0;width:40%;z-index:4}#tapL{left:0}#tapR{right:0}#tapM{left:40%;width:20%}
#crack{position:absolute;inset:0;width:100%;height:100%}
#crack polyline{fill:none;stroke:#fff;stroke-width:1.6;opacity:.75;vector-effect:non-scaling-stroke}
#tiers{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card{pointer-events:auto;width:92px;padding:10px 4px;border-radius:14px;border:2px solid #2a3545;background:rgba(0,232,255,.05);color:var(--ink);font-size:13px;cursor:pointer}
.card.sel{border-color:var(--ok);box-shadow:0 0 12px rgba(53,255,122,.3)}
.card .ic{font-size:28px}
#ad{background:rgba(0,0,0,.92);z-index:25}
#toast{position:absolute;top:15%;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:8px 18px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.on{opacity:1}
#stageBanner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;z-index:15}
#stageBanner.on{opacity:1}
#stageBanner .fromto{font-size:clamp(16px,3.8vw,24px);font-weight:700}
#stageBanner .sub{font-size:12px;color:var(--gold);margin-top:5px}
#cityFX{position:absolute;inset:0;pointer-events:none;z-index:12;opacity:0;transition:opacity .45s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16%}
#cityFX.on{opacity:1}
#cityFX .skyline{display:flex;align-items:flex-end;gap:2px;height:80px;filter:drop-shadow(0 0 10px rgba(0,232,255,.3))}
#cityFX .b{background:linear-gradient(180deg,rgba(0,232,255,.3),rgba(10,20,40,.9));border:1px solid rgba(0,232,255,.35);border-radius:2px 2px 0 0;animation:cp 2.2s ease-in-out infinite}
@keyframes cp{0%,100%{opacity:.7}50%{opacity:1}}
#cityFX .name{position:absolute;top:26%;left:0;right:0;text-align:center;font-size:clamp(20px,4.5vw,32px);font-weight:800;letter-spacing:2px;color:var(--neon);text-shadow:0 0 20px rgba(0,232,255,.5)}
#cityFX .label{position:absolute;top:34%;left:0;right:0;text-align:center;font-size:12px;letter-spacing:2px;color:var(--gold);opacity:.85}
#help{position:absolute;bottom:calc(110px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:11px;color:rgba(232,244,255,.35);pointer-events:none;z-index:5}
@media(max-height:400px){.pill{font-size:12px;padding:4px 10px}.ib{width:46px;height:46px;font-size:18px}.ib.big{width:72px;height:72px;font-size:34px}#spd{font-size:22px}}
button.pill{color:var(--ink);font-family:inherit;cursor:pointer}
#routeHud{top:calc(50px + env(safe-area-inset-top,0px))!important}
#prog{position:absolute;top:calc(42px + env(safe-area-inset-top,0px));left:30%;right:30%;height:4px;background:rgba(255,255,255,.18);border-radius:2px;z-index:5}
#progf{display:block;height:100%;width:0;background:var(--gold);border-radius:2px}
#cd{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:clamp(64px,20vh,130px);font-weight:900;color:#fff;text-shadow:0 0 30px var(--gold),0 0 4px #000;pointer-events:none;opacity:0;z-index:16}
.pop{animation:pop .7s ease-out}@keyframes pop{0%{transform:scale(2);opacity:0}25%{opacity:1}100%{transform:scale(1)}}
.wbtn{pointer-events:auto;border:2px solid var(--neon);background:rgba(0,232,255,.1);color:var(--ink);border-radius:14px;padding:10px 16px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}.wbtn.gold{border-color:var(--gold)}
#bat{position:relative;height:36px;border:2px solid var(--ink);border-radius:8px;margin:12px 0 6px;overflow:hidden;background:#0a1018}
#batf{display:block;height:100%;width:0;transition:width .6s,background .6s}
#batv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;text-shadow:0 0 6px #000}
#arrival{background:radial-gradient(ellipse at 50% 110%,rgba(255,201,77,.38),rgba(3,5,8,.55) 65%)}
#arrival .arTop{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center}
#arrival .arFlag{font-size:13px;letter-spacing:4px;color:var(--gold);opacity:0;animation:fi .5s .2s forwards}
#arrival .arCity{font-size:clamp(26px,7vh,44px);font-weight:900;letter-spacing:3px;color:#fff;text-shadow:0 0 24px var(--gold);animation:pop .8s .3s both}
#arrival .arSub{font-size:13px;opacity:0;animation:fi .5s .8s forwards}
#arSk{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;gap:3px}
#arSk .b{background-image:repeating-linear-gradient(0deg,transparent 0 8px,rgba(255,236,170,.6) 8px 10px),linear-gradient(180deg,rgba(255,201,77,.4),rgba(8,14,28,.96) 75%);border:1px solid rgba(255,201,77,.5);border-radius:2px 2px 0 0;transform-origin:bottom;animation:rise .7s cubic-bezier(.2,.9,.3,1.1) both,glw 2.4s ease-in-out infinite}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes glw{0%,100%{filter:brightness(.8)}50%{filter:brightness(1.3)}}
#arrival .panel{top:47%;opacity:0;animation:fi .5s 1.3s forwards}
.wbtn.sel{border-color:var(--ok);box-shadow:0 0 12px rgba(53,255,122,.35)}
#citems,#ladder{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.card .ic svg{width:64px;height:28px;display:block;margin:0 auto}
.sw{width:34px;height:34px;border-radius:50%;margin:6px auto;border:2px solid rgba(255,255,255,.5)}
#fbar{height:10px;border:1px solid var(--gold);border-radius:6px;margin:8px 0;overflow:hidden}
#fbarf{display:block;height:100%;width:0;background:var(--gold)}
#wrb{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:150px;width:52px;height:52px;font-size:22px;z-index:6}
#thb{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:62px;width:78px;height:78px;font-size:34px;z-index:6}
#rlb{position:absolute;right:calc(104px + env(safe-area-inset-right,0px));bottom:70px;width:56px;height:56px;font-size:24px;z-index:6}
#bsb{position:absolute;bottom:62px;z-index:6}
</style>
</head><body>
<div id="stage">
<div id="glass"></div><div id="gas"></div>

<div id="splash" class="layer on">
  <svg class="logo" viewBox="0 0 320 110"><defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e8ff"/><stop offset="50%" stop-color="#7af"/><stop offset="100%" stop-color="#ffc94d"/>
    </linearGradient></defs>
    <path class="wf-fill" d="M20 78 L55 68 L95 42 L155 32 L215 38 L255 58 L295 68 L300 82 L20 82 Z"/>
    <polyline class="wf" points="20,78 55,68 95,42 155,32 215,38 255,58 295,68 300,82 20,82"/>
    <polyline class="wf" points="95,42 120,58 230,58 255,58"/>
    <circle class="wf" cx="80" cy="82" r="13"/><circle class="wf" cx="245" cy="82" r="13"/>
    <polyline class="wf" points="60,70 100,55 200,55 250,65" style="stroke:url(#g1);stroke-width:1.5;opacity:.7"/>
  </svg>
  <div class="tag">ROADSTER · LOOP</div>
</div>

<div id="menu" class="layer">
  <div class="title">ROADSTER</div>
  <div class="route" id="menuRoute">Pretoria → Kingston</div>
  <div class="hint" data-i="hint"></div>
  <div class="top">
    <div class="pill">🔋 <b class="mv">0</b></div>
    <div class="pill" id="tb">I</div><button class="pill" id="chgp" type="button">⚡ <b id="chgv">100</b>%</button><button class="pill" id="lgb" type="button">🌐 EN</button>
    <button class="ib" style="width:40px;height:40px;font-size:17px" id="bt" type="button">🏆</button>
  </div>
  <div class="row">
    <button class="ib" id="bu" type="button">⬆️</button><button class="ib" id="bc" type="button">🎨</button>
    <button class="ib big" id="bs" type="button">🚀</button>
    <button class="ib" id="bf" type="button">🤝</button><button class="ib" id="bq" type="button">📋</button>
  </div>
</div>

<div id="hud" class="layer">
  <div class="top">
    <div class="pill">📏 <b id="sc">0</b></div>
    <div class="pill" id="bn">⚡ 100%</div><div class="pill">LV <b id="lv">1</b></div><div class="pill" id="mu" style="color:var(--gold)">×2</div>
  </div>
  <div id="routeHud"><b id="cityFrom">Pretoria</b> → <span id="cityTo">Kingston</span> · <b id="kmv">0</b>/450 <span data-i="km"></span></div><div id="prog"><i id="progf"></i></div>
  <div id="air"><i id="airf"></i></div>
  <div class="ico" style="left:calc(8px + env(safe-area-inset-left,0px));bottom:200px">💨</div>
  <div id="fan"></div>
  <div class="ico" style="left:calc(38px + env(safe-area-inset-left,0px));bottom:128px">🌀</div>
  <div class="dash">
    <svg viewBox="0 0 280 100">
      <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(8,14,24,.95)"/><stop offset="100%" stop-color="rgba(4,8,14,.98)"/>
      </linearGradient></defs>
      <path d="M14 6 L14 52 Q14 88 52 88 L228 88 Q266 88 266 52 L266 6" fill="url(#dg)" stroke="var(--yoke)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 8 L24 52 Q24 78 52 78 L228 78 Q256 78 256 52 L256 8" fill="none" stroke="var(--gold)" stroke-width="1.6" opacity=".85"/>
      <rect x="95" y="28" width="90" height="42" rx="8" fill="rgba(0,20,30,.7)" stroke="rgba(0,232,255,.3)" stroke-width="1.5"/>
    </svg>
    <div id="spd">0<small>KM/H</small></div>
  </div>
  <button class="ib" id="wrb" type="button">🧲</button><button class="ib" id="thb" type="button" style="display:none">✈️</button><button class="ib" id="bsb" type="button" style="display:none">🔥</button><button class="ib" id="rlb" type="button" style="display:none">🔄</button><div id="cd"></div><div id="help"></div>
  <div class="tapzone" id="tapL"></div>
  <div class="tapzone" id="tapR"></div><div class="tapzone" id="tapM"></div>
</div>

<div id="cityFX">
  <div class="name" id="cityName">PRETORIA</div>
  <div class="label" id="cityLabel">START</div>
  <div class="skyline" id="skyline"></div>
</div>
<div id="stageBanner">
  <div class="fromto" id="sbText">Pretoria → Kingston</div>
  <div class="sub" id="sbSub"></div>
</div>

<div id="crash" class="layer">
  <svg id="crack" viewBox="0 0 100 100" preserveAspectRatio="none">
    <polyline points="55,40 30,8"/><polyline points="55,40 92,18"/><polyline points="55,40 99,56"/>
    <polyline points="55,40 72,98"/><polyline points="55,40 18,72"/><polyline points="55,40 1,44"/><polyline points="55,40 38,99"/>
  </svg>
  <div class="panel">
    <div>📏 <b id="rm">0</b></div>
    <div>+<b id="rg">0</b> 🔋</div><div>⚡ <b id="rb">0</b>%</div>
    <div id="nr">🏆 🆕</div>
    <div class="row">
      <button class="ib" id="br" type="button">↻</button>
      <button class="ib" id="bh" type="button">🏠</button><button class="ib" id="brv" type="button">❤️</button><button class="ib" id="bx2" type="button"><span style="font-size:14px;font-weight:800">📺×2</span></button><button class="ib" id="bsh" type="button">📤</button>
    </div>
  </div>
</div>

<div id="shop" class="layer">
  <div class="top">
    <button class="ib" style="width:40px;height:40px;font-size:17px" id="sb" type="button">⬅️</button>
    <div class="pill">🔋 <b class="mv">0</b></div>
  </div>
  <div class="panel" style="width:min(90vw,380px)">
    <div id="tiers"></div><div id="tierInfo" style="font-size:12px;opacity:.9;margin-top:10px;line-height:1.45"></div>
    <div class="row">
      <button class="ib" id="sad" type="button">🎁</button>
      <button class="ib" id="sst" type="button">🎨</button>
    </div>
    <div style="margin-top:10px;font-size:12px;opacity:.55">🎁 📺 → 🤖 40<span data-i="sec"></span></div><button class="pill" id="sdbg" type="button" style="margin-top:8px;font-size:15px;border-color:var(--gold)">⭐ 1 → +1 000 🔋</button><button class="pill" id="sdbg2" type="button" style="display:none;margin:6px 0 0 6px;font-size:12px;border-color:var(--gold)">🧪 +100000</button>
  </div>
</div>

<div id="station" class="layer">
  <div class="top"><button class="ib" style="width:40px;height:40px;font-size:17px" id="stb" type="button">⬅️</button><div class="pill">🔋 <b class="mv">0</b></div></div>
  <div class="panel" style="width:min(92vw,420px)">
    <div style="font-size:16px;opacity:.85">🔌 <span data-i="stT"></span></div>
    <div id="bat"><i id="batf"></i><b id="batv">0%</b></div>
    <div id="batT" style="font-size:12px;opacity:.65"></div>
    <div class="row"><button class="wbtn" id="ch1" type="button">📺 +50%</button><button class="wbtn gold" id="chS" type="button">⭐ 100%</button><button class="ib" id="stGo" type="button" style="display:none;width:72px;height:72px;font-size:32px">▶</button></div>
    <div style="font-size:12px;opacity:.55;margin-top:8px">⏱ 2:00 = 100% · 📺 ×1 = 50% · ⭐ 1 = 100%<br><span data-i="stN"></span></div>
  </div>
</div>
<div id="arrival" class="layer">
  <div class="arTop"><div class="arFlag">🏁 <span data-i="fin"></span></div><div class="arCity" id="arCity"></div><div class="arSub" id="arSub"></div></div>
  <div id="arSk"></div>
  <div class="panel"><div id="arStats" style="font-size:17px"></div><div id="arNext" style="font-size:13px;opacity:.7;margin-top:6px"></div>
    <div class="row"><button class="ib big" id="arGo" type="button" style="width:72px;height:72px;font-size:32px">▶</button><button class="ib" id="arHome" type="button">🏠</button><button class="ib" id="arSh" type="button">📤</button></div></div>
</div>
<div id="custom" class="layer">
  <div class="top"><button class="ib" style="width:40px;height:40px;font-size:17px" id="cb" type="button">⬅️</button><div class="pill">🔋 <b class="mv">0</b></div></div>
  <div class="panel" style="width:min(94vw,500px)">
    <div><button class="wbtn" id="ct_body" type="button">🎨</button> <button class="wbtn" id="ct_yoke" type="button">🕹️</button> <button class="wbtn" id="ct_neon" type="button">💡</button></div>
    <div id="citems"></div>
    <div style="font-size:12px;opacity:.55;margin-top:8px">🔋 · 📺 · ⭐ Telegram Stars</div>
  </div>
</div>
<div id="friends" class="layer">
  <div class="top"><button class="ib" style="width:40px;height:40px;font-size:17px" id="fb" type="button">⬅️</button><div class="pill">🔋 <b class="mv">0</b></div></div>
  <div class="panel" style="width:min(94vw,520px);padding:14px 18px">
    <div style="font-size:16px">🤝 <span data-i="fr"></span> · <b id="fcnt">0</b>/10</div>

function wallRide(){
  if(state!=='GAMEPLAY'||cd>0||wallPhase||!grounded)return;

function updateWallRide(dt){
  if(!wallPhase||state!=='GAMEPLAY'){if(!wallPhase){bankAng=0;bankTarget=0}return}
  wrT+=dt;
  if(wrT<.7){wallPhase=1;bankTarget=wrDir*Math.PI*.42}
  else if(wrT<3.4){if(wallPhase===1)beep(420,.18,'sawtooth',.09);wallPhase=2;bankTarget=wrDir*Math.PI*.92}
  else{wallPhase=3;bankTarget=0;if(Math.abs(bankAng)<.06){wallPhase=0;bankAng=0;reviveUntil=Math.max(reviveUntil,T+.7);return}}
  bankAng+=(bankTarget-bankAng)*Math.min(1,2.2*dt);
}
function puff(o){var g=$('gas');g.style.setProperty('--o',o);g.classList.remove('on');void g.offsetWidth;g.classList.add('on')}
function showCd(t){var e=$('cd');e.textContent=t;e.style.opacity=1;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function stepGame(dt){
  var usedGas=false;
  if(cd>0){cd-=dt;var n=Math.ceil(cd);
    if(cd<=0){showCd('GO');goT=.8;cityT=Math.min(cityT,.6);beep(900,.35,'square',.1)}
    else if(n!==cdN){cdN=n;showCd(n);beep(500,.12,'square',.08)}
    if(cd>0)return}
  if(goT>0){goT-=dt;if(goT<=0)$('cd').style.opacity=0}
  T+=dt;
  var t100=TIERS[S.tier-1].t100;
  var boostOn=S.tier>=2&&boostHeld()&&air>0&&kmh>=100&&!wallPhase;   // ускоритель: только 2-я и 3-я модели
  if(boostOn){kmh=Math.min(BOOSTK,kmh+45*dt);air-=20*dt;usedGas=true;puffT-=dt;if(puffT<=0){puff(.25);puffT=.35}}
  else if(kmh<100)kmh=Math.min(100,kmh+100/t100*dt);
  else kmh=kmh>MAXK?Math.max(MAXK,kmh-30*dt):Math.min(MAXK,kmh+((MAXK-kmh)*0.048+1.8)*dt);
  var v=kmh/3.6,mult=T<multUntil?2:1;
  score+=v*dt*mult;stageDist+=v*dt;
  updateWallRide(dt);if(wrCool>0&&!wallPhase)wrCool-=dt;

  // Autopilot lane choice
  if(autoUntil>0&&T<autoUntil){
    var danger=null;
    for(var ai=0;ai<act.length;ai++){
      var om=act[ai];if(!om.visible)continue;
      var dz=om.position.z;
      if(dz<-2&&dz>-30&&Math.abs(om.userData.lat-px)<2.0){
        if(!danger||dz>danger.position.z)danger=om;
      }
    }
    if(danger){
      var blocked=danger.userData.lane,best=lane,bestSc=-9;
      for(var L=0;L<=2;L++){
        if(L===blocked)continue;
        var sc=(L===1?3:2),busy=false;
        for(var bj=0;bj<act.length;bj++){
          var bm=act[bj];if(!bm.visible)continue;
          if(bm.userData.lane===L&&bm.position.z<-1&&bm.position.z>-24){busy=true;break}
        }
        if(!busy&&sc>bestSc){bestSc=sc;best=L}
      }
      lane=best;
    }
  }else if(autoUntil>0&&T>=autoUntil){autoUntil=0;toast('🤖 '+t('ap')+' '+t('apo'))}

  var dx=(lane-1)*LANE_W-px;
  px+=dx*Math.min(1,15*dt);
  steerA+=(dx*12-steerA)*Math.min(1,10*dt);
  tilt+=(-dx*0.035-tilt)*Math.min(1,8*dt);
  if(grounded)shakeKick=Math.max(shakeKick,Math.min(1,Math.abs(dx)/3)*(S.tier===1?0.4:0.12));

  if(S.tier>=3&&thrust&&air>0&&!wallPhase){
    if(grounded){grounded=false;vy=4.2;puff(.4)}
    vy=Math.min(8,vy+28*dt);air-=20*dt;usedGas=true;puffT-=dt;if(puffT<=0){puff(.3);puffT=.3}
  }
  if(!grounded){
    vy-=19*dt;y+=vy*dt;air=Math.max(0,air);
    if(y>=5){y=5;if(vy>0)vy=0}
    if(y<=0){y=0;vy=0;grounded=true;shakeKick=Math.max(shakeKick,0.3);beep(120,0.1,'triangle',0.09)}
  }
  if(air<0)air=0;
  if(!usedGas)air=Math.min(100,air+100/30*dt);   // воздух: полный запас за 30 секунд

  if(rolling){rollT+=dt/0.7;if(rollT>=1){rolling=false;rollT=0}}
  rollAng=rolling?rollT*Math.PI*2:0;

  updateBonus(v,dt);sinceRow+=v*dt;
  if(sinceRow>=gap){sinceRow=0;gap=(Math.max(25,v*0.855)+Math.random()*7.2)/GAPF[dIdx()];spawnRow()}

  for(var i=act.length-1;i>=0;i--){
    var m=act[i],d=m.userData,z0=m.position.z;
    m.position.z+=v*dt;
    if(m.position.z-d.l/2>12){m.visible=false;act.splice(i,1);continue}
    if(!invincible()&&z0<=d.l/2+0.35&&m.position.z>=-(d.l/2+0.35)&&Math.abs(d.lat-px)<d.w/2+0.45&&y<d.h-0.12){
      crash();return;
    }
  }
  if(stageDist>=stageGoal){stageClear();return}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('stageBanner').classList.remove('on')}
  if(cityT>0){cityT-=dt;if(cityT<=0)$('cityFX').classList.remove('on')}
}

function tubePos(ang,lat,h){
  var w=Math.min(1,Math.abs(ang)/0.5),r=(-GY-1.25)*(1-w)+(R_TUBE-1.25)*w-h,ca=Math.cos(ang),sa=Math.sin(ang);
  return{x:lat*ca+sa*r,y:lat*sa-ca*r};
}

function update(dt,now){
  if(state==='GAMEPLAY')stepGame(dt);
  else if(state==='CRASH')kmh=0;else if(state==='ARRIVAL')kmh=Math.max(0,kmh-45*dt);
  shakeKick*=Math.exp(-3.5*dt);
  var v=kmh/3.6;
  var nf=66+Math.min(20,kmh*0.05);if(Math.abs(nf-cam.fov)>.2){cam.fov=nf;cam.updateProjectionMatrix()}
  for(var si=0;si<tubeSegs.length;si++){
    var seg=tubeSegs[si];seg.position.z+=v*dt;
    if(seg.position.z>SEG_LEN/2+8)seg.position.z-=SEG_LEN*SEG_N;
  }
  // Obstacles always on floor
  for(var ai=0;ai<act.length;ai++){
    var m=act[ai];if(!m.visible)continue;
    
    m.position.x=m.userData.lat;m.position.y=GY;m.rotation.z=0;
  }
  if(state==='GAMEPLAY'||state==='CRASH'||state==='ARRIVAL'){
    var amp=kmh*0.00007+shakeKick*0.08;
    var rnd=function(){return(Math.random()-0.5)*2*amp};
    var pp=tubePos(bankAng,px+rnd(),y);
    cam.position.set(pp.x,pp.y,rnd());
    cam.rotation.set(Math.max(-0.09,Math.min(0.09,vy*0.01)),0,bankAng+tilt*0.4+rollAng+rnd()*0.1);
  }else{
    var s=now/1000,pm=tubePos(0,Math.sin(s*0.25)*0.25,0);
    cam.position.set(pm.x,pm.y+Math.sin(s*0.4)*0.04,0);
    cam.rotation.set(0.02,Math.sin(s*0.2)*0.025,0);
  }
  if(vac)vac.gain.value=(state==='GAMEPLAY'&&grounded)?0.018+Math.min(0.08,shakeKick*0.15)+kmh/5500:0;
  if(state==='GAMEPLAY')hud();
}

var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(!R||!scene||!cam)return;
  checkOrient();
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt,now);
  R.render(scene,cam);
}

function startGift(){if(START_GIFT&&!S.gift){S.gift=1;S.miles+=START_GIFT}}
function dailyBonus(){var d=Math.floor(Date.now()/864e5);if(!S.day){S.day=d;S.streak=0;return}if(S.day===d)return;S.streak=(S.day===d-1)?Math.min(7,(S.streak||0)+1):1;S.day=d;var b=500*S.streak;S.miles+=b;setTimeout(function(){toast('🎁 '+t('day')+' '+S.streak+': +'+fmt(b)+' 🔋')},2200)}
setInterval(function(){if(state==='MENU'||state==='STATION'){refresh();if(state==='STATION')renderStation()}},1000);
setState('BOOT');tgReady();
load(function(){
  tgIdentity();lang=detectLang();applyLang();dailyBonus();startGift();refInit();save();refresh();
  setTimeout(function(){setState('MENU')},1600);
});
requestAnimationFrame(frame);
})();
</script>
</body></html>
